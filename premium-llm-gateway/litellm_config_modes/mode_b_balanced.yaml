# =============================================================================
# MODE B — Balanced / Likely Product Mode
#
# Spec calls for: simple -> Flash, normal -> MiMo-Pro, hard fallback -> DS V4 Pro.
# True complexity classification needs a thin gateway in front of LiteLLM and
# is explicitly out-of-scope for the first MVP. So this mode approximates the
# routing behaviour using LiteLLM-only primitives:
#
#   dev-auto  -> MiMo-Pro (the "normal" path)
#   on failure or context overflow -> DS V4 Flash (the "simple/cheap" path)
#   then -> DS V4 Pro (the "hard fallback" path)
#
# The intent: most calls land on premium MiMo, but failures cascade to the
# cheaper Flash before we burn money on Pro. This is the closest single-route
# approximation of Mode B that we can express in pure config.
# =============================================================================

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

litellm_settings:
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  request_timeout: 180
  num_retries: 1
  set_verbose: false
  drop_params: true

model_list:
  - model_name: mimo-pro
    litellm_params:
      model: openai/mimo-v2.5-pro
      api_base: https://REPLACE_WITH_MIMO_OPENAI_COMPATIBLE_BASE/v1
      api_key: os.environ/MIMO_API_KEY
    model_info:
      mode: chat
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000003

  - model_name: deepseek-v4-pro
    litellm_params:
      model: openai/deepseek-v4-pro
      api_base: https://REPLACE_WITH_DEEPSEEK_OPENAI_COMPATIBLE_BASE/v1
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      mode: chat
      input_cost_per_token: 0.0000014
      output_cost_per_token: 0.0000028

  - model_name: deepseek-v4-flash
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: https://REPLACE_WITH_DEEPSEEK_OPENAI_COMPATIBLE_BASE/v1
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      mode: chat
      input_cost_per_token: 0.00000014
      output_cost_per_token: 0.00000028

  - model_name: claude-benchmark
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      mode: chat

  # MODE B: dev-auto starts on MiMo, but cheaper Flash before Pro on failure.
  - model_name: dev-auto
    litellm_params:
      model: openai/mimo-v2.5-pro
      api_base: https://REPLACE_WITH_MIMO_OPENAI_COMPATIBLE_BASE/v1
      api_key: os.environ/MIMO_API_KEY
    model_info:
      mode: chat
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000003
      metadata:
        routing_mode: B
        reason: balanced

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  allowed_fails: 2
  cooldown_time: 60

  fallbacks:
    # Flash before Pro on cost grounds.
    - dev-auto:
        - deepseek-v4-flash
        - deepseek-v4-pro
    - mimo-pro:
        - deepseek-v4-flash
        - deepseek-v4-pro
    - deepseek-v4-pro:
        - deepseek-v4-flash
        - mimo-pro
    - deepseek-v4-flash:
        - mimo-pro

  # Big-context prompts must NOT silently get cheaper Flash; jump to Pro.
  context_window_fallbacks:
    - dev-auto:
        - deepseek-v4-pro
        - claude-benchmark
